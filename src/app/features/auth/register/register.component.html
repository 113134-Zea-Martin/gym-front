<div class="container-fluid bg-dark min-vh-100">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="mx-auto w-100 w-md-75 w-lg-100 p-4 p-md-5 rounded-4 bg-dark text-white shadow">
                <button class="btn btn-link text-white p-0 mb-3">
                    <i class="bi bi-arrow-left fs-3"></i>
                </button>
                <h2 class="text-center fw-bold mb-1" style="letter-spacing: 1px">
                    IRONFLOW
                </h2>
                <h1 class="text-center fw-bold mb-2" style="font-size: 2.2rem">
                    Create your account
                </h1>
                <p class="text-center text-secondary mb-4 fs-5">
                    Join the flow and start tracking your gains today.
                </p>

                <form [formGroup]="registerFormGroup" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <input type="email" id="email"
                            class="form-control form-control-lg bg-secondary text-white border-0 rounded-4"
                            placeholder="Enter your email" formControlName="email" />
                        <div *ngIf="registerFormGroup.get('email')?.touched && registerFormGroup.get('email')?.invalid"
                            class="text-danger mt-1">
                            <small *ngIf="registerFormGroup.get('email')?.errors?.['required']">Email is
                                required.</small>
                            <small *ngIf="registerFormGroup.get('email')?.errors?.['email']">Please enter a valid email
                                address.</small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="position-relative">
                            <input [type]="showPassword ? 'text' : 'password'" id="password"
                                class="form-control form-control-lg bg-secondary text-white border-0 rounded-4 pe-5"
                                placeholder="Create a password" formControlName="password" />
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer"
                                (click)="togglePasswordVisibility('password')">
                                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    class="fs-3 text-black"></i>
                            </span>
                        </div>
                        <div *ngIf="registerFormGroup.get('password')?.touched && registerFormGroup.get('password')?.invalid"
                            class="text-danger mt-1">
                            <small *ngIf="registerFormGroup.get('password')?.errors?.['required']">Password is
                                required.</small>
                            <small *ngIf="registerFormGroup.get('password')?.errors?.['minlength']">Password must be
                                at least 6 characters long.</small>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                        <div class="position-relative">
                            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword"
                                class="form-control form-control-lg bg-secondary text-white border-0 rounded-4 pe-5"
                                placeholder="Repeat your password" formControlName="confirmPassword" />
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer"
                                (click)="togglePasswordVisibility('confirmPassword')">
                                <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    class="fs-3 text-black"></i>
                            </span>
                        </div>
                        <div *ngIf="registerFormGroup.get('confirmPassword')?.touched && registerFormGroup.get('confirmPassword')?.invalid"
                            class="text-danger mt-1">
                            <small *ngIf="registerFormGroup.get('confirmPassword')?.errors?.['required']">Confirm
                                Password is required.</small>
                            <small *ngIf="registerFormGroup.get('confirmPassword')?.errors?.['mismatch']">
                                Passwords do not match.
                            </small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow mb-3">
                        Create account
                    </button>
                </form>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 bg-secondary border-0" style="height: 2px" />
                    <span class="mx-2 text-secondary fw-bold">or</span>
                    <hr class="flex-grow-1 bg-secondary border-0" style="height: 2px" />
                </div>

                <button
                    class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2 rounded-4 mb-3 btn-lg">
                    <i class="bi bi-google fs-4"></i>
                    <span class="fw-bold">Continue with Google</span>
                </button>

                <div class="text-center mt-2">
                    <span class="text-secondary">Already have an account?</span>
                    <a routerLink="/auth/login" class="text-primary fw-bold ms-1">Log in</a>
                </div>
            </div>
        </div>
    </div>
</div>
