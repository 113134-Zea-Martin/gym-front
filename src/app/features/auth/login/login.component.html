<div class="container-fluid bg-dark min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <div class="p-4 p-md-5">
                <!-- Botón de regreso -->
                <button class="btn btn-link text-white p-0 mb-4 text-decoration-none">
                    <i class="bi bi-arrow-left fs-4"></i>
                </button>

                <!-- Logo / Marca -->
                <h2 class="text-center text-white fw-bold mb-2 text-uppercase ls-3">
                    IRONFLOW
                </h2>

                <!-- Título principal -->
                <h1 class="text-center text-white fw-bold mb-3 fs-1">
                    Welcome back, athlete.
                </h1>

                <!-- Subtítulo -->
                <p class="text-center text-secondary mb-4">
                    Push your limits today.
                </p>

                <!-- Formulario -->
                <form [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label text-white fw-semibold mb-2">Email</label>
                        <input type="email" id="email"
                            class="form-control form-control-lg bg-dark text-white border border-secondary rounded-3"
                            placeholder="athlete@ironflow.com" formControlName="email" />
                        <div *ngIf="loginFormGroup.get('email')?.touched && loginFormGroup.get('email')?.invalid"
                            class="text-danger mt-2 small">
                            <small *ngIf="loginFormGroup.get('email')?.errors?.['required']">Email is required.</small>
                            <small *ngIf="loginFormGroup.get('email')?.errors?.['email']">Please enter a valid email address.</small>
                        </div>
                    </div>
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label text-white fw-semibold mb-2">Password</label>
                        <div class="position-relative">
                            <input [type]="showPassword ? 'text' : 'password'" id="password"
                                class="form-control form-control-lg bg-dark text-white border border-secondary rounded-3 pe-5"
                                placeholder="Enter your password" formControlName="password" />
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer"
                                (click)="togglePasswordVisibility()">
                                <i class="bi text-secondary" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </span>
                        </div>
                        <div *ngIf="loginFormGroup.get('password')?.touched && loginFormGroup.get('password')?.invalid"
                            class="text-danger mt-2 small">
                            <small *ngIf="loginFormGroup.get('password')?.errors?.['required']">Password is required.</small>
                        </div>
                        <div class="text-end mt-2">
                            <a routerLink="/auth/forgot-password" class="text-secondary text-decoration-none small">Forgot Password?</a>
                        </div>
                    </div>
                    <!-- Botón login -->
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3 mb-4"
                        [disabled]="loginFormGroup.invalid">
                        Log In <i class="bi bi-lightning-charge ms-2"></i>
                    </button>
                </form>

                <!-- Separador -->
                <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1 border-secondary opacity-50 m-0" />
                    <span class="mx-3 text-secondary">or</span>
                    <hr class="flex-grow-1 border-secondary opacity-50 m-0" />
                </div>

                <!-- Google login -->
                <button
                    class="btn btn-outline-secondary btn-lg w-100 d-flex align-items-center justify-content-center gap-2 rounded-3 mb-3 text-white"
                    (click)="loginWithGoogle()">
                    <i class="bi bi-google"></i>
                    <span>Continue with Google</span>
                </button>

                <!-- Enlace a registro -->
                <div class="text-center mt-4">
                    <span class="text-secondary">Don't have an account?</span>
                    <a routerLink="/auth/register" class="text-success text-decoration-none fw-semibold ms-1">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal de error -->
<div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.7);" *ngIf="showErrorModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white rounded-4 border border-secondary shadow-lg">
            <div class="modal-header border-0 pb-0">
                <i class="bi bi-exclamation-circle text-danger" style="font-size: 2rem;"></i>
                <button type="button" class="btn-close btn-close-white ms-auto" aria-label="Close"
                    (click)="closeErrorModal()"></button>
            </div>
            <div class="modal-body text-center">
                <h5 class="fw-bold mb-2 text-danger">Login Error</h5>
                <p class="text-secondary mb-0">{{ errorMessage }}</p>
            </div>
            <div class="modal-footer border-0 pt-0 justify-content-center">
                <button type="button" class="btn btn-primary fw-bold rounded-3 px-4" (click)="closeErrorModal()">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>
